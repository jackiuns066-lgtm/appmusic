name: Build Android APK

# ── زمان اجرا ──────────────────────────────────────────────────────────────
# با هر push روی شاخهٔ main (و شاخهٔ کاری فعلی)، روی Pull Request به main
# و همچنین با اجرای دستی از تب Actions.
on:
  push:
    branches:
      - "main"
      - "arena/01a0f112-appmusic"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

# اگر چند push پشت سر هم انجام شود، اجرای قبلی لغو می‌شود
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # در صورت نبود، Android SDK 36 (Android 16) را نصب می‌کند
      - name: Ensure Android SDK 36
        continue-on-error: true
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-log.txt

      # خطاهای کامپایل را به‌صورت Annotation نشان می‌دهد (حداکثر ۱۰ مورد)
      - name: Report build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import io, os

          path = "build-log.txt"
          if not os.path.exists(path):
              print("::error::build-log.txt not found")
              raise SystemExit(0)

          lines = io.open(path, encoding="utf-8", errors="replace").read().split("\n")
          keys = ("e: ", "error:", "FAILURE:", "What went wrong", "Execution failed", "Caused by")
          picked = [l for l in lines if l.strip().startswith(keys)]
          if not picked:
              picked = lines[-40:]

          text = "\n".join(picked)[-55000:] or "unknown failure"
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with io.open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## Build errors\n\n```\n" + text + "\n```\n")

          chunks, current = [], ""
          for line in text.split("\n"):
              if len(current) + len(line) + 1 > 5000:
                  chunks.append(current)
                  current = ""
              current += line + "\n"
          chunks.append(current)

          for chunk in chunks[:10]:
              escaped = chunk.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print("::error::" + escaped)
          PY

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: my-app-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # لاگ کامل بیلد (هم برای موفق و هم برای ناموفق) + گزارش‌های خطا
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: |
            build-log.txt
            app/build/reports/
          if-no-files-found: ignore
