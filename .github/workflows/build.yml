name: Build Android APK

# ── زمان اجرا ──────────────────────────────────────────────────────────────
# با هر push روی شاخهٔ main (و شاخهٔ کاری فعلی)، روی Pull Request به main
# و همچنین با اجرای دستی از تب Actions.
on:
  push:
    branches:
      - "main"
      - "arena/01a0f112-appmusic"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

# اگر چند push پشت سر هم انجام شود، اجرای قبلی لغو می‌شود
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # در صورت نبود، Android SDK 36 (Android 16) را نصب می‌کند
      - name: Ensure Android SDK 36
        continue-on-error: true
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      # کلید امضای اختصاصی از Secrets خوانده می‌شود (اختیاری).
      # اگر تنظیم نشده باشد، نسخهٔ release با همان کلید debug امضا می‌شود تا نصب‌شدنی بماند.
      - name: Decode upload keystore
        env:
          NOVO_KEYSTORE_BASE64: ${{ secrets.NOVO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$NOVO_KEYSTORE_BASE64" ]; then
            echo "$NOVO_KEYSTORE_BASE64" | base64 -d > keystore/novo-upload.p12
            echo "✅ upload keystore ready"
          else
            echo "ℹ️ NOVO_KEYSTORE_BASE64 is not set - the release APK will use the debug key"
          fi

      - name: Build APKs
        env:
          NOVO_KEYSTORE_PASSWORD: ${{ secrets.NOVO_KEYSTORE_PASSWORD }}
          NOVO_KEY_ALIAS: ${{ secrets.NOVO_KEY_ALIAS }}
          NOVO_KEY_PASSWORD: ${{ secrets.NOVO_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease assembleCanary --stacktrace 2>&1 | tee build-log.txt

      # اثر انگشت کلید امضا در لاگ چاپ می‌شود تا مطمئن شویم همهٔ بیلدها
      # با یک کلید یکسان امضا می‌شوند (شرط نصب روی نسخهٔ قبلی).
      # اثر انگشت کلید در هر بیلد با ::warning:: چاپ می‌شود تا از تب Actions قابل دیدن باشد
      - name: Show signing certificates
        if: always()
        run: |
          KEYSTORE_FP=$(keytool -list -v -keystore keystore/novo-debug.p12 -storepass android -storetype PKCS12 2>&1 \
            | grep -i -m1 'SHA256:' | sed 's/.*SHA256: *//' || true)
          echo "::warning::project keystore SHA256: ${KEYSTORE_FP:-unknown}"

          # توجه: این APKها با امضای v2/v3 (نه JAR signature) امضا شده‌اند، پس باید با apksigner خوانده شوند.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "apksigner: ${APKSIGNER:-not found}"

          for apk in \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/canary/app-canary.apk ; do
            [ -f "$apk" ] || continue
            FP=$([ -n "$APKSIGNER" ] && "$APKSIGNER" verify --print-certs "$apk" 2>/dev/null \
              | grep -i -m1 'certificate SHA-256 digest' | sed 's/.*digest: *//' || true)
            echo "::warning::$(basename "$apk") SHA256: ${FP:-unknown}"
          done

      # بررسی امضا: اگر APK با کلید ثابت پروژه امضا نشده باشد، بیلد Fail می‌شود
      - name: Verify debug APK signature
        if: success()
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          EXPECTED=$(keytool -list -v -keystore keystore/novo-debug.p12 -storepass android -storetype PKCS12 2>&1 \
            | grep -i -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -cd '0-9A-Fa-f' | tr 'a-f' 'A-F')
          ACTUAL=$([ -n "$APKSIGNER" ] && "$APKSIGNER" verify --print-certs "$APK" 2>&1 \
            | grep -i -m1 'certificate SHA-256 digest' | sed 's/.*digest: *//' | tr -cd '0-9A-Fa-f' | tr 'a-f' 'A-F' || true)
          echo "keystore: $EXPECTED"
          echo "apk     : $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "::error::could not read the signature of $APK (apksigner=${APKSIGNER:-missing})"
            "$APKSIGNER" verify --print-certs "$APK" 2>&1 | head -20 || true
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::app-debug.apk is NOT signed with keystore/novo-debug.p12 (apk=$ACTUAL keystore=$EXPECTED) - installations would conflict."
            exit 1
          fi
          echo "✅ debug APK is signed with the project keystore"

      # خطاهای کامپایل را به‌صورت Annotation نشان می‌دهد (حداکثر ۱۰ مورد)
      - name: Report build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import io, os

          path = "build-log.txt"
          if not os.path.exists(path):
              print("::error::build-log.txt not found")
              raise SystemExit(0)

          lines = io.open(path, encoding="utf-8", errors="replace").read().split("\n")
          keys = ("e: ", "error:", "FAILURE:", "What went wrong", "Execution failed", "Caused by")
          picked = [l for l in lines if l.strip().startswith(keys)]
          if not picked:
              picked = lines[-40:]

          text = "\n".join(picked)[-55000:] or "unknown failure"
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with io.open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## Build errors\n\n```\n" + text + "\n```\n")

          chunks, current = [], ""
          for line in text.split("\n"):
              if len(current) + len(line) + 1 > 5000:
                  chunks.append(current)
                  current = ""
              current += line + "\n"
          chunks.append(current)

          for chunk in chunks[:10]:
              escaped = chunk.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print("::error::" + escaped)
          PY

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: my-app-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: my-app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      # نسخهٔ دوم با شناسهٔ بستهٔ متفاوت: همیشه نصب می‌شود، حتی اگر نسخهٔ قبلی
      # جایی روی گوشی (پروفایل کاری، فضای دوم، اپ کلون‌شده) پنهان مانده باشد.
      - name: Upload canary APK (different package id)
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: my-app-canary-apk
          path: app/build/outputs/apk/canary/app-canary.apk
          if-no-files-found: warn

      # لاگ کامل بیلد (هم برای موفق و هم برای ناموفق) + گزارش‌های خطا
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: |
            build-log.txt
            app/build/reports/
          if-no-files-found: ignore
