name: Build Android APK

# ── زمان اجرا ──────────────────────────────────────────────────────────────
# با هر push روی شاخهٔ main (و شاخهٔ کاری فعلی) و همچنین اجرای دستی از تب Actions
on:
  push:
    branches:
      - "main"
      - "arena/01a0f112-appmusic"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

# اگر چند بار پشت سر هم push شد، اجرای قبلی لغو می‌شود تا وقت تلف نشود
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # اندروید SDK نسخهٔ ۳۶ (Android 16) را در صورت نبود نصب می‌کند
      - name: Ensure Android SDK 36
        continue-on-error: true
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # در صورت خطا، گزارش‌ها هم برای بررسی آپلود می‌شوند
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
